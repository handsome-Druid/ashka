name: Update dishka

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Get latest dishka version
        id: dishka
        run: |
          uv run --with packaging python -c '
          import json
          import os
          import tomllib
          from urllib.request import urlopen
          from packaging.version import Version
          from packaging.specifiers import SpecifierSet

          with open("pyproject.toml", "rb") as file:
            project = tomllib.load(file)

          requirement = next(
            dependency
            for dependency in project["project"]["dependencies"]
            if dependency.startswith("dishka")
          )
          specifiers = SpecifierSet(requirement.partition("dishka")[2])
          lower = next(
            specifier.version
            for specifier in specifiers
            if specifier.operator in {">", ">="}
          )
          current = next(
            specifier.version
            for specifier in specifiers
            if specifier.operator in {"<", "<="}
          )
          with urlopen("https://pypi.org/pypi/dishka/json") as response:
              releases = json.load(response)["releases"]

          versions = [
              Version(version)
              for version, files in releases.items()
              if files
              and not Version(version).is_prerelease
              and not all(file["yanked"] for file in files)
          ]
          latest = max(versions)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"lower={lower}\n")
              output.write(f"current={current}\n")
              output.write(f"latest={latest}\n")
              output.write(f"changed={str(latest > Version(current)).lower()}\n")
          '

      - name: Update dishka requirement
        if: steps.dishka.outputs.changed == 'true'
        run: uv add "dishka>=${{ steps.dishka.outputs.lower }},<=${{ steps.dishka.outputs.latest }}"

      - name: Bump package version
        if: steps.dishka.outputs.changed == 'true'
        run: uv version --bump patch --bump beta

      - name: Commit and push update
        if: steps.dishka.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Update dishka to ${{ steps.dishka.outputs.latest }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run CI
        if: steps.dishka.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME" -f ref="$sha"

          while true; do
            run_id=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          gh run watch "$run_id" --exit-status

      - name: Tag and publish release
        if: steps.dishka.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(uv version --short)"
          git tag "$tag"
          git push origin "$tag"
          gh workflow run publish.yml --ref "$tag"
