name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}
      dishka-versions: ${{ steps.matrix.outputs.dishka-versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate test matrix
        id: matrix
        run: |
          matrix=$(uv run --no-project --with packaging --with tomli python - <<'PY'
          import json
          from pathlib import Path

          import tomli
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          project = tomli.loads(Path("pyproject.toml").read_text())["project"]
          requires_python = SpecifierSet(project["requires-python"])
            dependencies = [
              Requirement(dependency)
              for dependency in project["dependencies"]
            ]
            if len(dependencies) != 1 or dependencies[0].name.lower() != "dishka":
              raise RuntimeError(
                f"Dishka must be the only project dependency: {dependencies}"
              )

          python_versions = []
          minor = 10

          while minor < 100:
              version = Version(f"3.{minor}")
              if version in requires_python:
                python_versions.append(str(version))
              elif python_versions:
                  break
              minor += 1

          if not python_versions:
              raise RuntimeError(
                  f"No supported Python versions found for {requires_python}"
              )

          dishka = next(
              (
                  requirement
                for requirement in dependencies
                if requirement.name.lower() == "dishka"
              ),
              None,
          )
          if dishka is None:
              raise RuntimeError("Dishka dependency not found")

          lower_bounds = [
              Version(specifier.version)
              for specifier in dishka.specifier
              if specifier.operator == ">="
          ]
          upper_bounds = [
              Version(specifier.version)
              for specifier in dishka.specifier
              if specifier.operator == "<="
          ]
          if not lower_bounds or not upper_bounds:
              raise RuntimeError(
                  f"Dishka must have closed >= and <= bounds: {dishka.specifier}"
              )

          dishka_versions = list(
              dict.fromkeys(map(str, (max(lower_bounds), min(upper_bounds))))
          )
          if any(version not in dishka.specifier for version in map(Version, dishka_versions)):
              raise RuntimeError(f"Invalid Dishka bounds: {dishka.specifier}")

          print(json.dumps({
              "python": python_versions,
              "dishka": dishka_versions,
          }))
          PY
          )
          echo "python-versions=$(echo "$matrix" | jq -c '.python')" >> "$GITHUB_OUTPUT"
          echo "dishka-versions=$(echo "$matrix" | jq -c '.dishka')" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    name: Test (Python ${{ matrix.python-version }}, Dishka ${{ matrix.dishka-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}
        dishka-version: ${{ fromJSON(needs.matrix.outputs.dishka-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run --with "dishka==${{ matrix.dishka-version }}" pytest --cov=ashka --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lint
        run: uv run ruff check .

  pyright:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pyright
        run: uv run pyright src tests

  production:
    needs: matrix
    name: Production (Python ${{ matrix.python-version }}, Dishka ${{ matrix.dishka-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}
        dishka-version: ${{ fromJSON(needs.matrix.outputs.dishka-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify production environment
        run: uv run --no-dev --with "dishka==${{ matrix.dishka-version }}" python -c "import ashka"
