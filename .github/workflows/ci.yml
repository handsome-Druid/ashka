name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate Python matrix
        id: matrix
        run: |
          versions=$(uv run --no-project --with packaging python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          requires_python = SpecifierSet(project["requires-python"])

          versions = []
          minor = 10

          while minor < 100:
              version = Version(f"3.{minor}")
              if version in requires_python:
                  versions.append(str(version))
              elif versions:
                  break
              minor += 1

          if not versions:
              raise RuntimeError(
                  f"No supported Python versions found for {requires_python}"
              )

          print(json.dumps(versions))
          PY
          )
          echo "python-versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=ashka --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lint
        run: uv run ruff check .

  production:
    needs: matrix
    name: Production (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify production environment
        run: uv run --no-dev python -c "import ashka"
