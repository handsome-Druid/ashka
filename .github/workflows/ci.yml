name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}
      ashka-versions: ${{ steps.matrix.outputs.ashka-versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Upgrade ashka lock
        run: uv lock --upgrade-package ashka

      - name: Generate test matrix
        id: matrix
        run: |
          matrix=$(uv run --no-project --with packaging --with tomli python - <<'PY'
          import json
          from pathlib import Path

          import tomli
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          project = tomli.loads(Path("pyproject.toml").read_text())["project"]
          lock = tomli.loads(Path("uv.lock").read_text())
          requires_python = SpecifierSet(project["requires-python"])
          dependencies = [
              Requirement(dependency)
              for dependency in project["dependencies"]
          ]
          if len(dependencies) != 1 or dependencies[0].name.lower() != "ashka":
              raise RuntimeError(
                  f"ashka must be the only project dependency: {dependencies}"
              )

          python_versions = []
          minor = 10

          while minor < 100:
              version = Version(f"3.{minor}")
              if version in requires_python:
                python_versions.append(str(version))
              elif python_versions:
                  break
              minor += 1

          if not python_versions:
              raise RuntimeError(
                  f"No supported Python versions found for {requires_python}"
              )

          ashka = dependencies[0]

          lower_bounds = [
              Version(specifier.version)
              for specifier in ashka.specifier
              if specifier.operator == ">="
          ]
            if not lower_bounds:
              raise RuntimeError(f"ashka must have a >= lower bound: {ashka.specifier}")

            resolved_versions = [
              Version(package["version"])
              for package in lock["package"]
              if package["name"] == "ashka"
            ]
            if len(resolved_versions) != 1:
              raise RuntimeError(f"Expected one locked ashka version: {resolved_versions}")

            ashka_versions = list(
              dict.fromkeys(map(str, (max(lower_bounds), resolved_versions[0])))
            )

          print(json.dumps({
              "python": python_versions,
              "ashka": ashka_versions,
          }))
          PY
          )
          echo "python-versions=$(echo "$matrix" | jq -c '.python')" >> "$GITHUB_OUTPUT"
          echo "ashka-versions=$(echo "$matrix" | jq -c '.ashka')" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    name: Test (Python ${{ matrix.python-version }}, ashka ${{ matrix.ashka-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}
        ashka-version: ${{ fromJSON(needs.matrix.outputs.ashka-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pin Python version
        run: uv python pin "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run --with "ashka==${{ matrix.ashka-version }}" pytest --cov=ashka_lifecycle --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lint
        run: uv run ruff check .

  pyright:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pyright
        run: uv run pyright src tests

  production:
    needs: matrix
    name: Production (Python ${{ matrix.python-version }}, ashka ${{ matrix.ashka-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix.outputs.python-versions) }}
        ashka-version: ${{ fromJSON(needs.matrix.outputs.ashka-versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pin Python version
        run: uv python pin "${{ matrix.python-version }}"

      - name: Verify production environment
        run: uv run --no-dev --with "ashka==${{ matrix.ashka-version }}" python -c "import ashka_lifecycle"
