name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Wait for CI
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 30 * 60 * 1000;
            let run;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                head_sha: context.sha,
                per_page: 1,
              });

              [run] = data.workflow_runs;
              if (run && run.status === "completed") {
                if (run.conclusion !== "success") {
                  throw new Error(`CI finished with conclusion: ${run.conclusion}`);
                }
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 30 * 1000));
            }

            throw new Error("CI did not complete within 30 minutes");

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Generate type stubs
        run: |
          uv run pyright --createstub ashka
          cp -R typings/ashka/. src/ashka/
          touch src/ashka/py.typed

      - name: Build package
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
