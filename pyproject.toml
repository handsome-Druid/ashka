[project]
name = "ashka-lifecycle"
version = "0.1.2"
description = "dishka lifecycle support"
readme = "README.md"
authors = [
    { name = "handsome-Druid", email = "102826168@qq.com" }
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "dishka>=1.9.0,<=1.10.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ashka>=0.8.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.ruff]
exclude = ["typings"]
