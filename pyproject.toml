[project]
name = "ashka"
version = "0.1.0"
description = "Addons for dishka"
readme = "README.md"
authors = [
    { name = "山泥若叶睦", email = "102826168@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dishka>=1.10.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "litestar>=2.24.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "sanic>=25.12.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "first-party",
    "third-party",
    "local-folder",
]
